<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Agregar Producto</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1 id="titulo">Registro de Producto</h1>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="productos.html">Productos</a>
        <a href="agregar.html">Agregar Producto</a>
    </nav>

    <main>

        <div id="mensaje" class="mensaje" hidden></div>

        <form id="formulario" novalidate>

            <label for="nombre">Nombre del producto</label>
            <input type="text" id="nombre" placeholder="Ingrese nombre" maxlength="60">
            <span class="error" id="error-nombre"></span>

            <label for="categoria">Categoría</label>
            <input type="text" id="categoria" placeholder="Ingrese categoría" maxlength="40">
            <span class="error" id="error-categoria"></span>

            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" rows="4" maxlength="200"></textarea>
            <span class="error" id="error-descripcion"></span>

            <label for="cantidad">Cantidad</label>
            <input type="number" id="cantidad" placeholder="0" min="0" step="1">
            <span class="error" id="error-cantidad"></span>

            <button type="submit" id="boton-guardar">
                Guardar Producto
            </button>

        </form>

    </main>

    <footer>
        Sistema de Inventario
    </footer>

    <script src="js/inventario.js"></script>
    <script src="js/formulario.js"></script>

</body>

</html>
