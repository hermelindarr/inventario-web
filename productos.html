<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Inventario de Productos</h1>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="productos.html">Productos</a>
        <a href="agregar.html">Agregar Producto</a>
    </nav>

    <main>

        <div id="mensaje" class="mensaje" hidden></div>

        <div class="acciones-tabla">
            <button type="button" id="exportar" class="boton-chico">Exportar a Excel</button>
        </div>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Existencia</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody id="cuerpo-tabla">
                <!-- Las filas se cargan desde js/productos.js -->
            </tbody>

        </table>

    </main>

    <footer>
        Sistema de Inventario
    </footer>

    <img class="tulipanes" src="img/tulipanes.png" alt="" onerror="this.remove()">

    <!-- Librería para crear el archivo de Excel (.xlsx) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="js/inventario.js"></script>
    <script src="js/productos.js"></script>

</body>

</html>
